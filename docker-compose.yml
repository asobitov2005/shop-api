name: shop-api

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12-slim}
        UV_VERSION: ${UV_VERSION:-0.10.8}
        API_PORT: ${API_PORT:-8000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app_test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TEST_REDIS_URL: ${TEST_REDIS_URL:-redis://redis:6379/1}
      TASK_WEBHOOK_SECRET: ${TASK_WEBHOOK_SECRET:-local-task-webhook-secret}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-58000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/openapi.json' % os.environ['API_PORT'])"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12-slim}
        UV_VERSION: ${UV_VERSION:-0.10.8}
        API_PORT: ${API_PORT:-8000}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TASK_WEBHOOK_SECRET: ${TASK_WEBHOOK_SECRET:-local-task-webhook-secret}
    command: ["uv", "run", "python", "-m", "app.worker.main"]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
