name: shop-api

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app_test}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TEST_REDIS_URL: ${TEST_REDIS_URL:-redis://redis:6379/1}
      TASK_WEBHOOK_SECRET: ${TASK_WEBHOOK_SECRET:-local-task-webhook-secret}
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
